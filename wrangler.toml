# Cloudflare Worker – Beko Verkaufs-Challenge 2026 · Race to Turkey (Verkäufer:innen Incentive)
name = "verkaeuferinnen-incentive"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Im Dashboard gesetzte Variablen (z. B. ADMINS) beim Deploy behalten
keep_vars = true

[[d1_databases]]
binding = "DB"
database_name = "incentive-db"
database_id = "93c4dfc1-3f64-49d1-9a12-1e4645ed041e"

[[kv_namespaces]]
binding = "FILES"
id = "d915389afa28452bb34a15f5c7fe3ee6"

