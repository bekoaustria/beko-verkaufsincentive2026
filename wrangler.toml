# Cloudflare Worker – Beko Verkaufs-Challenge 2026 · Race to Turkey (Verkäufer:innen Incentive)
name = "verkaeuferinnen-incentive"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Im Dashboard gesetzte Variablen (z. B. ADMINS) beim Deploy behalten
keep_vars = true

[[d1_databases]]
binding = "DB"
database_name = "incentive-db"
database_id = "HIER-D1-ID-EINTRAGEN"

[[kv_namespaces]]
binding = "FILES"
id = "HIER-KV-ID-EINTRAGEN"

# Optional statt im Dashboard:
# [vars]
# ADMINS = "harald.kasperowski@beko.com"

# Secrets NIE hier eintragen, sondern im Dashboard (Settings → Variables and Secrets)
# oder per: npx wrangler secret put SESSION_SECRET / ANTHROPIC_API_KEY
